{% extends 'racing_board/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4 shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Подача заявки на заезд</h3>
                <p class="text-muted text-center">Выберите ваш бортовой номер</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Отправить заявку</button>
                </form>
                <div class="text-center mt-3">
                    <a href="javascript:history.back()">Отмена</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
